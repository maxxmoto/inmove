<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | INMOVE</title>
    <link rel="icon" type="image/png" href="/static/inmove_logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f5f5f7; --text: #1a1a1a; --accent: #f87e00; }
        body.dark-theme { --bg: #07070d; --text: #eeeef0; --accent: #f87e00; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; text-align: center; padding: 2rem;
            transition: background 0.3s, color 0.3s;
        }
        h1 { font-size: 6rem; font-weight: 900; color: var(--accent); line-height: 1; }
        p { font-size: 1.1rem; margin: 1rem 0 2rem; color: var(--text); opacity: 0.7; }
        a {
            display: inline-block; background: var(--accent); color: white;
            padding: 0.7rem 2rem; border-radius: 100px;
            text-decoration: none; font-weight: 600; transition: opacity 0.2s;
        }
        a:hover { opacity: 0.85; }
    </style>
    <link rel="apple-touch-icon" href="/static/favicon.png">
</head>
<body>
    <div>
        <h1>404</h1>
        <p>Страница не найдена</p>
        <a href="/">На главную</a>
    </div>
    <script>
        const saved = localStorage.getItem('theme');
        if (saved === 'dark') document.body.classList.add('dark-theme');
    </script>
</body>
</html>
